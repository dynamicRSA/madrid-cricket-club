name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy invite-member --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy delete-member --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy send-notification --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy notify-admin-join --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy notify-member-approved --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Secrets are managed via CLI and already set on the Supabase project.
      # This step only updates them if the corresponding GitHub repo secrets are defined.
      - name: Set Edge Function secrets (optional)
        continue-on-error: true
        run: |
          [ -n "$RESEND_API_KEY" ] && supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          [ -n "$ADMIN_EMAIL" ] && supabase secrets set ADMIN_EMAIL="$ADMIN_EMAIL" --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
